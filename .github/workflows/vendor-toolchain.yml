name: Vendor 3DS toolchain
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/vendor-toolchain.yml']
permissions: {contents: write}
jobs:
  vendor-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/SakuraiTsubaki/Sakurai/fc49c1d94d483bc90245c2251bf6f223d51e7224/tools/vendor_3ds_toolchain.sh -o /tmp/vendor_3ds_toolchain.sh
          PROJECT_ROOT="$PWD" bash /tmp/vendor_3ds_toolchain.sh
      - run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f vendor/toolchain/linux-x86_64; git diff --cached --quiet && exit 0
          git commit -m 'tooling: vendor 3DS toolchain binaries'; git fetch origin main && git rebase origin/main && git push origin HEAD:main
